<!DOCTYPE html>
<html>
<head>
    <title>Hybrid Stress Test - Battery + 2S SC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; text-align:center; background:#f4f6f9; }
        h1 { margin-top:20px; }

        .container { 
            display:flex; 
            justify-content:center; 
            gap:30px; 
            margin:20px; 
            flex-wrap:wrap;
        }

        .box {
            background:white;
            padding:20px 35px;
            border-radius:10px;
            box-shadow:0 3px 10px rgba(0,0,0,0.2);
            min-width:180px;
        }

        .value { 
            font-size:24px; 
            font-weight:bold; 
        }

        .battery { color:#007acc; }
        .sc { color:#ff6600; }

        canvas { width:90% !important; height:400px !important; }

        button {
            padding:10px 20px;
            margin:10px;
            font-size:16px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<h1>Hybrid Stress Test - Battery + 4S Supercapacitor</h1>

<div class="container">

    <div class="box">
        <h3>Battery Current (mA)</h3>
        <div class="value battery" id="batteryCurrent">0</div>
    </div>

    <div class="box">
        <h3>Battery Peak (mA)</h3>
        <div class="value battery" id="peakBattery">0</div>
    </div>

    <div class="box">
        <h3>Battery RMS (mA)</h3>
        <div class="value battery" id="rmsBattery">0</div>
    </div>

    <div class="box">
        <h3>SC Current (mA)</h3>
        <div class="value sc" id="scCurrent">0</div>
    </div>

    <div class="box">
        <h3>SC Peak (mA)</h3>
        <div class="value sc" id="peakSC">0</div>
    </div>

    <div class="box">
        <h3>SC RMS (mA)</h3>
        <div class="value sc" id="rmsSC">0</div>
    </div>

</div>

<button onclick="relayOn()">Turn Load ON</button>
<button onclick="relayOff()">Turn Load OFF</button>
<button onclick="downloadCSV()">Download Excel CSV</button>

<canvas id="chart"></canvas>

<script>

const ctx = document.getElementById('chart').getContext('2d');
let time = 0;

const chart = new Chart(ctx, {
    type: 'line',
    data: {
        datasets: [
            {
                label: 'Battery Current (mA)',
                data: [],
                borderColor: '#007acc',
                borderWidth: 2,
                fill: false,
                tension: 0.2
            },
            {
                label: 'Supercapacitor Current (mA)',
                data: [],
                borderColor: '#ff6600',
                borderWidth: 2,
                fill: false,
                tension: 0.2
            }
        ]
    },
    options: {
        animation:false,
        scales: {
            x: { 
                type:'linear', 
                title:{display:true,text:'Time (s)'} 
            },
            y: { 
                title:{display:true,text:'Current (mA)'} 
            }
        }
    }
});

let scSumSquared = 0;
let scSamples = 0;

setInterval(() => {

    fetch("http://10.159.35.97/data")
    .then(res => res.json())
    .then(data => {

        // ===== BATTERY =====
        document.getElementById("batteryCurrent").innerText =
            data.batteryCurrent.toFixed(2);

        document.getElementById("peakBattery").innerText =
            data.peakBattery.toFixed(2);

        document.getElementById("rmsBattery").innerText =
            data.rmsBattery.toFixed(2);

        // ===== SUPERCAP =====
        document.getElementById("scCurrent").innerText =
            data.scCurrent.toFixed(2);

        document.getElementById("peakSC").innerText =
            data.peakSC.toFixed(2);

        // Calculate SC RMS on frontend
        scSumSquared += data.scCurrent * data.scCurrent;
        scSamples++;
        let scRMS = Math.sqrt(scSumSquared / scSamples);

        document.getElementById("rmsSC").innerText =
            scRMS.toFixed(2);

        // ===== GRAPH =====
        chart.data.datasets[0].data.push({
            x: time,
            y: data.batteryCurrent
        });

        chart.data.datasets[1].data.push({
            x: time,
            y: data.scCurrent
        });

        chart.update();
        time++;

    });

}, 1000);

function relayOn(){
    fetch("http://10.159.35.97/relayOn");
}

function relayOff(){
    fetch("http://10.159.35.97/relayOff");
}

function downloadCSV(){
    window.open("http://10.159.35.97/download");
}

</script>

</body>
</html>
